<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>බාගත කිරීම් | Galewela Royal College</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --royal-blue: #002147;
            --gold: #D4AF37;
            --white: #ffffff;
            --light-bg: #f4f7f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Abhaya Libre', sans-serif; }
        body { background-color: var(--light-bg); }

        /* Navigation Fix with Dropdown */
        nav { background: var(--royal-blue); position: sticky; top: 0; z-index: 9999; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        nav ul { list-style: none; display: flex; justify-content: center; align-items: center; max-width: 1200px; margin: 0 auto; }
        nav ul li { position: relative; }
        nav ul li a { display: block; padding: 20px 15px; color: white; text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: 0.3s; }
        nav ul li a:hover { color: var(--gold); }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--royal-blue);
            min-width: 200px;
            top: 100%;
            left: 0;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            border-top: 3px solid var(--gold);
        }
        .dropdown-content a { padding: 12px 16px; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        nav ul li:hover .dropdown-content { display: block; }

        /* Header */
        .page-header {
            background: linear-gradient(rgba(0,33,71,0.8), rgba(0,33,71,0.8)), url('school_front.jpg') center/cover no-repeat;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border-bottom: 5px solid var(--gold);
        }
        .page-header h1 { font-family: 'Abhaya Libre', serif; font-size: 2.5rem; color: var(--gold); }

        /* Search Bar */
        .search-box {
            max-width: 600px;
            margin: 30px auto 0;
            padding: 0 20px;
            text-align: center;
        }
        #searchInput {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid var(--royal-blue);
            outline: none;
            font-size: 1rem;
        }

        /* Downloads Container */
        .download-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .section-title {
            margin: 30px 0 20px;
            color: var(--royal-blue);
            border-bottom: 3px solid var(--gold);
            display: inline-block;
            font-family: 'Abhaya Libre', serif;
            font-size: 1.8rem;
        }

        .download-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 6px solid var(--royal-blue);
            transition: 0.3s;
        }
        .download-card:hover { transform: translateX(10px); background: #fdfdfd; }
