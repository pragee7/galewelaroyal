<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Login | Galewela Royal College</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --royal-blue: #002147;
            --gold: #D4AF37;
            --light-bg: #f4f7f9;
        }

        body {
            font-family: 'Poppins', 'Abhaya Libre', sans-serif;
            background: linear-gradient(135deg, var(--royal-blue) 0%, #00152e 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-container img {
            height: 80px;
            margin-bottom: 15px;
        }

        .login-container h2 {
            color: var(--royal-blue);
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .login-container p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--royal-blue);
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--royal-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #003366;
            transform: translateY(-2px);
        }

        .error-msg {
            color: #e74c3c;
            background: #fdeaea;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            color: var(--royal-blue);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .back-home:hover {
            color: var(--gold);
        }
    </style>
</head>
<body>

<div class="login-container">
    <img src="logo.png" alt="School Logo">
    <h2>LMS ලොගින්</h2>
    <p>ඉගෙනුම් කළමනාකරණ පද්ධතියට ඇතුළු වන්න</p>

    <div id="error" class="error-msg">පරිශීලක නාමය හෝ මුරපදය වැරදියි!</div>

    <form id="loginForm">
        <div class="input-group">
            <label>පරිශීලක නාමය</label>
            <input type="text" id="username" placeholder="Username ඇතුළත් කරන්න" required>
        </div>
        <div class="input-group">
            <label>මුරපදය</label>
            <input type="password" id="password" placeholder="Password ඇතුළත් කරන්න" required>
        </div>
        <button type="submit" class="login-btn">ඇතුළු වන්න</button>
    </form>

    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> නැවත මුල් පිටුවට</a>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const error = document.getElementById('error');

        // මෙතැන ඔයාට අවශ්‍ය Username සහ Password එක සකසන්න
        if (user === "admin" && pass === "royal123") {
            alert("සාර්ථකව ලොග් විය!");
            window.location.href = "student.html"; // ලොග් වූ පසු යන පිටුව
        } else {
            error.style.display = "block";
        }
    });
</script>

</body>
</html>
