<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>දැක්ම සහ මෙහෙවර | Galewela Royal College</title>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --royal-blue: #002147; --gold: #D4AF37; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f9; line-height: 1.6; color: #333; }

        /* Header Styles */
        header { background: white; padding: 20px 50px; display: flex; align-items: center; border-bottom: 4px solid var(--royal-blue); }
        .school-brand { display: flex; align-items: center; gap: 20px; }
        .logo { height: 70px; }
        .school-name h1 { color: var(--royal-blue); font-family: 'Abhaya Libre', serif; font-size: 1.5rem; }

        /* Navigation */
        nav { background: var(--royal-blue); padding: 10px 50px; }
        .nav-links { list-style: none; }
        .nav-links a { color: white; text-decoration: none; font-size: 0.9rem; }

        /* Vision & Mission Cards */
        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; text-align: center; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 30px; border-top: 5px solid var(--gold); }
        
        h2 { color: var(--royal-blue); font-family: 'Abhaya Libre', serif; font-size: 2.2rem; margin-bottom: 15px; }
        p { font-size: 1.2rem; color: #555; font-style: italic; }
        
        .icon { font-size: 3rem; margin-bottom: 10px; display: block; }

        .back-btn { display: inline-block; margin-top: 20px; padding: 12px 30px; background: var(--royal-blue); color: white; text-decoration: none; border-radius: 50px; transition: 0.3s; font-weight: 600; }
        .back-btn:hover { background: var(--gold); transform: translateY(-3px); }

        footer { background: #00152e; color: #ccc; padding: 20px; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <div class="school-brand">
        <img src="logo.png" alt="Logo" class="logo">
        <div class="school-name">
            <h1>ගලේවෙල රාජකීය විද්‍යාලය</h1>
        </div>
    </div>
</header>

<nav>
    <ul class="nav-links">
        <li><a href="index.html">🏠 මුල් පිටුවට</a></li>
    </ul>
</nav>

<div class="container">
    
    <div class="card">
        <span class="icon">👁️</span>
        <h2>අපේ දැක්ම</h2>
        <p>"නැණ ගුණ පිරිපුන් උදාර මිනිසකු බිහිකිරීම"</p>
    </div>

    <div class="card">
        <span class="icon">🎯</span>
        <h2>අපේ මෙහෙවර</h2>
        <p>"නිපුණතා පූර්ණ ශිෂ්‍ය පිරිසක් දැයට දායාද කිරීම සඳහා අවශ්‍ය පසුබිම සකස් කිරීම සහ ගුණාත්මක අධ්‍යාපනයක් ලබා දීම."</p>
    </div>

    <a href="index.html" class="back-btn">නැවත මුල් පිටුවට</a>
</div>

<footer>
    <p>&copy; 2026 Galewela Royal College.</p>
</footer>

</body>
</html>
