<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සම්බන්ධතා | Galewela Royal College</title>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
       /* Navigation Bar Styling */
nav {
    background: var(--royal-blue);
    padding: 0 50px;
    display: flex;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

nav ul {
    list-style: none;
    display: flex;
}

nav ul li {
    position: relative;
}

nav ul li a {
    display: block;
    padding: 15px 20px;
    color: white;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: 0.3s;
}

nav ul li a:hover {
    background: rgba(255,255,255,0.1);
    color: var(--gold);
}

/* Footer Styling */
footer {
    background: #00152e;
    color: #ccc;
    padding: 40px 20px;
    text-align: center;
    margin-top: 60px;
    border-top: 4px solid var(--gold);
}

.footer-content {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
    text-align: left;
}

.footer-section h3 { color: var(--gold); margin-bottom: 15px; }
.footer-section p { font-size: 0.9rem; line-height: 1.6; }

/* Mobile Menu - ෆෝන් එකට ගැලපෙන්න */
@media (max-width: 768px) {
    nav { padding: 0 10px; }
    nav ul { flex-wrap: wrap; justify-content: center; }
    nav ul li a { padding: 10px 12px; font-size: 0.85rem; }
    header { flex-direction: column; text-align: center; padding: 20px; }
    .logo { margin-bottom: 10px; margin-right: 0; }
}
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="Logo" class="logo">
    <div class="school-name"><h1>ගලේවෙල රාජකීය විද්‍යාලය</h1></div>
</header>

<nav><a href="index.html">🏠 මුල් පිටුවට</a></nav>

<div class="container">
    <div class="section-title">
        <h2>අප හා සම්බන්ධ වන්න</h2>
        <hr>
    </div>

    <div class="contact-wrapper">
        <div class="contact-info">
            <div class="info-item">
                <span>📍</span>
                <div>
                    <h4>ලිපිනය</h4>
                    <p>ගලේවෙල රාජකීය විද්‍යාලය,<br>පුවක්ගපිටිය, ලේවෙල.</p>
                </div>
            </div>
            <div class="info-item">
                <span>📞</span>
                <div>
                    <h4>දුරකථන</h4>
                    <p>070 784 3077</p>
                </div>
            </div>
            <div class="info-item">
                <span>✉️</span>
                <div>
                    <h4>ඊමේල්</h4>
                    <p>galewelaroyal@gmail.com</p>
                </div>
            </div>
        </div>

        <div class="contact-form">
            <form action="#">
                <div class="form-group">
                    <label>ඔබේ නම</label>
                    <input type="text" placeholder="මෙහි ටයිප් කරන්න...">
                </div>
                <div class="form-group">
                    <label>ඊමේල් ලිපිනය</label>
                    <input type="email" placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>පණිවිඩය</label>
                    <textarea rows="4" placeholder="ඔබට දැන ගැනීමට අවශ්‍ය දේ මෙහි ලියන්න..."></textarea>
                </div>
                <button type="submit" class="submit-btn">පණිවිඩය යොමු කරන්න</button>
            </form>
        </div>
    </div>

    <div class="map-container">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15814.757304192534!2d80.5750033!3d7.7591666!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ae346006f658057%3A0xc39f997b5757975d!2sGalewela!5e0!3m2!1sen!2slk!4v1700000000000!5m2!1sen!2slk" width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>
</div>

<footer><p>&copy; 2026 Galewela Royal College</p></footer>

</body>
</html>
