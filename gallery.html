<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ඡායාරූප එකතුව | Galewela Royal College</title>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
       /* Navigation Bar Styling */
nav {
    background: var(--royal-blue);
    padding: 0 50px;
    display: flex;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

nav ul {
    list-style: none;
    display: flex;
}

nav ul li {
    position: relative;
}

nav ul li a {
    display: block;
    padding: 15px 20px;
    color: white;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: 0.3s;
}

nav ul li a:hover {
    background: rgba(255,255,255,0.1);
    color: var(--gold);
}

/* Footer Styling */
footer {
    background: #00152e;
    color: #ccc;
    padding: 40px 20px;
    text-align: center;
    margin-top: 60px;
    border-top: 4px solid var(--gold);
}

.footer-content {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
    text-align: left;
}

.footer-section h3 { color: var(--gold); margin-bottom: 15px; }
.footer-section p { font-size: 0.9rem; line-height: 1.6; }

/* Mobile Menu - ෆෝන් එකට ගැලපෙන්න */
@media (max-width: 768px) {
    nav { padding: 0 10px; }
    nav ul { flex-wrap: wrap; justify-content: center; }
    nav ul li a { padding: 10px 12px; font-size: 0.85rem; }
    header { flex-direction: column; text-align: center; padding: 20px; }
    .logo { margin-bottom: 10px; margin-right: 0; }
}
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="Logo" class="logo">
    <div class="school-name"><h1>ගලේවෙල රාජකීය විද්‍යාලය</h1></div>
</header>

<nav><a href="index.html" style="color: white; text-decoration: none;">🏠 මුල් පිටුවට</a></nav>

<div class="container" style="text-align: center;">
    <div class="section-title">
        <h2>ඡායාරූප එකතුව</h2>
        <hr>
    </div>

    <div class="gallery-grid">
        <div class="gallery-item">
            <img src="g1.jpg" alt="Gallery 1">
            <div class="overlay">විද්‍යාලයීය ගොඩනැගිල්ල</div>
        </div>
        <div class="gallery-item">
            <img src="g2.jpg" alt="Gallery 2">
            <div class="overlay">පරිගණක විද්‍යාගාරය</div>
        </div>
        <div class="gallery-item">
            <img src="g3.jpg" alt="Gallery 3">
            <div class="overlay">ක්‍රීඩා උත්සවය</div>
        </div>
        <div class="gallery-item">
            <img src="g4.jpg" alt="Gallery 4">
            <div class="overlay">ත්‍යාග ප්‍රදානෝත්සවය</div>
        </div>
        <div class="gallery-item">
            <img src="g5.jpg" alt="Gallery 5">
            <div class="overlay">විද්‍යාගාරය</div>
        </div>
        <div class="gallery-item">
            <img src="g6.jpg" alt="Gallery 6">
            <div class="overlay">පුස්තකාලය</div>
        </div>
    </div>

    <a href="index.html" class="back-btn">නැවත මුල් පිටුවට</a>
</div>

<footer><p>&copy; 2026 Galewela Royal College</p></footer>

</body>
</html>
