<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ඡායාරූප එකතුව | Galewela Royal College</title>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --royal-blue: #002147; --gold: #D4AF37; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f0f2f5; color: #333; }

        /* Header & Nav */
        header { background: white; padding: 20px 50px; display: flex; align-items: center; border-bottom: 4px solid var(--royal-blue); }
        .logo { height: 60px; margin-right: 20px; }
        .school-name h1 { color: var(--royal-blue); font-family: 'Abhaya Libre', serif; font-size: 1.5rem; }
        nav { background: var(--royal-blue); padding: 10px 50px; }
        nav a { color: white; text-decoration: none; font-size: 0.9rem; font-weight: 500; }

        .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        .section-title { text-align: center; margin-bottom: 40px; }
        .section-title h2 { font-family: 'Abhaya Libre', serif; font-size: 2.5rem; color: var(--royal-blue); }
        .section-title hr { width: 80px; height: 4px; background: var(--gold); border: none; margin: 10px auto; }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            height: 250px;
            background-color: #ddd;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        /* Hover Effect */
        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,33,71,0.8));
            color: white;
            padding: 20px;
            opacity: 0;
            transition: 0.3s;
            text-align: center;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .back-btn { display: inline-block; margin-top: 40px; padding: 12px 35px; background: var(--royal-blue); color: white; text-decoration: none; border-radius: 50px; font-weight: 600; transition: 0.3s; }
        .back-btn:hover { background: var(--gold); }

        footer { background: #00152e; color: #ccc; padding: 25px; text-align: center; margin-top: 60px; }
    </style>
</head>
<body>

<header>

</header>

<nav><a href="index.html">🏠 මුල් පිටුවට</a></nav>

<div class="container">
    <div class="section-title">

        <hr>
    </div>

        </div>

        <div class="gallery-item">

        <div class="gallery-item">
